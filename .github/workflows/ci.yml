name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install the Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the compiler
        # Pinned, not "update to latest": 0.34.0 targets compact-runtime 0.19.0
        # and generates an async circuit-call API. package.json locks
        # compact-runtime at 0.16.0, which src/simulator.ts and src/devnet.ts
        # are written against — the compiler and the npm package move
        # together, and only one side of that pair was pinned before this.
        run: compact update 0.31.1

      - name: Compile the contract
        run: npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
