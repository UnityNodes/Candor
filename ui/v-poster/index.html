<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candor — is your money on their books?</title>
    <link rel="icon" href="/svg/candor-favicon.svg" />
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <a class="brand" href="/">Candor</a>
        <p class="claim" id="claim"></p>
      </header>

      <section class="cry" aria-live="polite">
        <h1 id="headline">Is your&nbsp;money on their&nbsp;books?</h1>
        <p class="under" id="subline">
          An exchange says it can cover what it owes. Pick a name and find out, without telling
          anyone which name you picked.
        </p>
      </section>

      <section class="evidence">
        <div class="track" id="track" aria-hidden="true"></div>
        <p class="reading" id="reading"></p>
      </section>

      <footer class="controls">
        <div class="line">
          <span class="cue">check as</span>
          <div class="words" id="chips"></div>
        </div>
        <div class="line">
          <span class="cue">they published</span>
          <div class="words" id="scenarios"></div>
        </div>
        <a class="repo" href="https://github.com/UnityNodes/Candor">github.com/UnityNodes/Candor</a>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
